# Secrets per stage; see docs/secrets.md.
[project]
name = "home-network"
revision = "1.0"

[providers]
home = "sops://secrets/home.yaml"
holiday = "sops://secrets/holiday.yaml"

[profiles.default]
wifi = { description = "SSIDs and passphrases: the `wifi` map in secrets/<stage>.yaml" }

[profiles.home.defaults]
providers = ["home"]

[profiles.holiday.defaults]
providers = ["holiday"]
