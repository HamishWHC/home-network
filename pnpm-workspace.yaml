allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - "@alchemy.run/docker@2.0.0-beta.84"
  - "@alchemy.run/kubernetes@2.0.0-beta.84"
  - "@alchemy.run/sql@2.0.0-beta.84"
  - "@effect/tsgo-darwin-arm64@0.56.1"
  - "@effect/tsgo-darwin-x64@0.56.1"
  - "@effect/tsgo-linux-arm64@0.56.1"
  - "@effect/tsgo-linux-arm@0.56.1"
  - "@effect/tsgo-linux-x64@0.56.1"
  - "@effect/tsgo-win32-arm64@0.56.1"
  - "@effect/tsgo-win32-x64@0.56.1"
  - "@effect/tsgo@0.56.1"
# The provider's `workspace:*` dependency on its SDK only resolves inside its
# own workspace, so point it at the local checkout too.
overrides:
  "@alchemy-unifi/network-sdk": "file:../alchemy-unifi/packages/network-sdk"
